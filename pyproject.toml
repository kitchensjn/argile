[project]
name = "argile"
version = "0.0.2"
authors = [{name="James Kitchens",email="kitchensjn@gmail.com"}]
description = "Estimating migration surfaces and the locations of genetic ancestors from gene trees"
license = "MIT"
readme = "README.md"
keywords = [
    "population genetics",
    "tree sequence",
    "ancestral recombination graph",
    "gene tree",
    "spatial analysis",
    "migration",
    "location"
]
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "numba",
    "scipy",
    "pandas",
    "tskit"
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
    "Development Status :: 3 - Alpha",
    "Environment :: Other Environment",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
"Homepage" = "https://github.com/kitchensjn/argile"
"Changelog" = "https://github.com/kitchensjn/argile/blob/main/CHANGELOG.rst"
"Bug Tracker" = "https://github.com/kitchensjn/argile/issues"

[build-system]
requires = [
    "setuptools>=42",
    "setuptools_scm",
    "wheel",
    "oldest-supported-numpy"
]

build-backend = "setuptools.build_meta"